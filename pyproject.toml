[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hadamard-llm"
version = "0.1.0"
description = "An ultra-lightweight, asynchronous LLM orchestration framework supercharged with Quantum Machine Learning (QML) plugins."
readme = "README.md"
authors = [{ name = "Yağız Yağlı"}]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
quantum = [
    "pennylane-qiskit>=0.35.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools]
# Explicitly tells the compiler which folders contain the installable framework code
packages = ["core", "plugins.quantum_qml"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_test_loop_scope = "function"
pythonpath = ["."]
