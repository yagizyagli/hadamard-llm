name: Hadamard-LLM CI Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set Up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Fundamental Testing Primitives
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir --prefer-binary httpx>=0.27.0 pytest>=8.0.0 pytest-asyncio>=0.24.0

    - name: Install Framework Locally (Editable Mode)
      run: |
        # Installing the package locally links the namespace dynamically and eliminates system naming collisions
        pip install -e .

    - name: Execute Automated Test Matrix
      run: |
        pytest
