name: Hadamard-LLM CI Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set Up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Fundamental Client Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install httpx>=0.27.0 pytest>=8.0.0 pytest-asyncio>=0.23.0

    - name: Install Optional Quantum Plugin Requirements
      run: |
        pip install qiskit>=1.0.0 pennylane>=0.35.0

    - name: Execute Automated Test Matrix
      run: |
        pytest
